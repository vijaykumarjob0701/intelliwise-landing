<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Intelliwise: Coming soon</title>
  <meta name="description" content="The Intelliwise. Coming soon. Practical notes on systems, databases, and applied AI.">
  <meta name="theme-color" content="#f6f5f2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1d1d1f" media="(prefers-color-scheme: dark)">
  <link rel="canonical" href="https://theintelliwise.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <link rel="apple-touch-icon" href="/assets/brand/apple-touch-icon.png">
  <meta property="og:title" content="The Intelliwise">
  <meta property="og:description" content="Coming soon. Practical notes on systems, databases, and applied AI.">
  <meta property="og:url" content="https://theintelliwise.com/">
  <meta property="og:type" content="website">
  <style>
    :root {
      --bg: #f6f5f2;
      --ink: #1d1d1f;
      --ink-muted: #6e6e73;
      --accent: #2f3f3a;
      --accent-soft: #e7ebe8;
      --rule: rgba(29, 29, 31, 0.1);
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1d1d1f;
        --ink: #f5f5f7;
        --ink-muted: #a1a1a6;
        --accent: #d5ddd8;
        --accent-soft: #2a2f2d;
        --rule: rgba(245, 245, 247, 0.12);
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: var(--bg);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: 100dvh;
    }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: clamp(1.5rem, 5vw, 3rem);
    }
    .card {
      width: min(36rem, 100%);
      text-align: center;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 0.7rem;
      color: inherit;
      text-decoration: none;
    }
    .brand-mark {
      width: 2rem;
      height: 2rem;
      flex-shrink: 0;
    }
    .brand-name {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    h1 {
      margin: 2rem 0 0.75rem;
      font-size: clamp(2.4rem, 8vw, 3.6rem);
      font-weight: 600;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }
    .tagline {
      margin: 0 auto;
      max-width: 28rem;
      color: var(--ink-muted);
      font-size: 1.05rem;
      line-height: 1.55;
    }
    .blog-link {
      display: inline-block;
      margin-top: 2rem;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      background: var(--accent);
      color: var(--bg);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
    }
    .blog-link:hover { opacity: 0.9; }
    .blog-link:focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }
    footer {
      padding: 1.25rem 1.5rem 1.75rem;
      text-align: center;
      color: var(--ink-muted);
      font-size: 0.85rem;
      border-top: 1px solid var(--rule);
    }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <div class="brand">
        <svg class="brand-mark" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" aria-hidden="true" focusable="false">
          <g stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="16" cy="16" r="13"/>
            <path d="M14.8 10.8 8.6 16l6.2 5.2"/>
            <path d="M18.6 10.8 13.8 21.2"/>
            <path d="M19.4 10.8 23.6 16l-4.2 5.2"/>
          </g>
        </svg>
        <span class="brand-name">The Intelliwise</span>
      </div>
      <h1>Coming soon</h1>
      <p class="tagline">Practical notes on systems, databases, and applied AI.</p>
      <a class="blog-link" href="https://blogs.theintelliwise.com/" target="_blank" rel="noopener">Read the blog</a>
    </div>
  </main>
  <footer>Vijay Kumar, Dublin</footer>
</body>
</html>
