<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Moved to the Intelliwise blog</title>
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0;url=https://blogs.theintelliwise.com/">
  <link rel="canonical" href="https://blogs.theintelliwise.com/">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon.png" type="image/png" sizes="32x32">
  <link rel="icon" href="/assets/favicon.ico" sizes="any">
  <style>
    :root { --bg: #f6f5f2; --ink: #1d1d1f; --muted: #6e6e73; --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    @media (prefers-color-scheme: dark) { :root { --bg: #1d1d1f; --ink: #f5f5f7; --muted: #a1a1a6; } }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; font-family: var(--sans); background: var(--bg); color: var(--ink); padding: 1.5rem; }
    p { max-width: 36rem; line-height: 1.5; color: var(--muted); }
    a { color: var(--ink); }
  </style>
  <script>
    (function () {
      var dest = "https://blogs.theintelliwise.com" + location.pathname + location.search + location.hash;
      var refresh = document.querySelector('meta[http-equiv="refresh"]');
      if (refresh) refresh.setAttribute("content", "0;url=" + dest);
      var canonical = document.querySelector('link[rel="canonical"]');
      if (canonical) canonical.setAttribute("href", dest);
      location.replace(dest);
    })();
  </script>
</head>
<body>
  <p>This page has moved to the Intelliwise blog. <a id="dest" href="https://blogs.theintelliwise.com/">Continue to the new address</a>.</p>
  <script>
    (function () {
      var dest = "https://blogs.theintelliwise.com" + location.pathname + location.search + location.hash;
      var link = document.getElementById("dest");
      if (link) link.setAttribute("href", dest);
    })();
  </script>
</body>
</html>
